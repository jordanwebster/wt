name = "python"
detect = ["pyproject.toml", "requirements.txt", "setup.py"]
default_tool = "pip"

[[nudge]]
if_tool = "pip"
want = "uv"
hint = "uv installs from a shared wheel cache across trees; consider migrating"

[[nudge]]
if_tool = "poetry"
want = "uv"
hint = "uv reads pyproject.toml directly and installs much faster than poetry"

[tools.uv]
lockfile = ["uv.lock"]
requires = "uv"
sync_inputs = ["uv.lock", "pyproject.toml"]
sync = "uv sync --frozen"

[tools.poetry]
lockfile = ["poetry.lock"]
requires = "poetry"
sync_inputs = ["poetry.lock", "pyproject.toml"]
sync = "poetry install"

[tools.pip]
requires = "python3"
sync_inputs = ["requirements.txt", "pyproject.toml"]
sync = '''test -d .venv || python3 -m venv .venv; if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; else .venv/bin/pip install -e . 2>/dev/null || true; fi'''
