name = "cargo"
detect = ["Cargo.toml"]
default_tool = "cargo"

[[nudge]]
want = "sccache"
used_if_env = ["RUSTC_WRAPPER=sccache"]
used_if_file = [{ file = "~/.cargo/config.toml", toml_key = "build.rustc-wrapper", contains = "sccache" }]
hint = "install sccache and set rustc-wrapper = \"sccache\" in ~/.cargo/config.toml [build]; every repo and tree on the machine then shares one compiled-crate cache, which is how a Rust tree starts warm"

[tools.cargo]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]

# A new tree starts with the canonical checkout's compiled dependencies: these
# directories are cloned copy-on-write from it when the filesystem can, and
# the tree stays cold otherwise. Nothing is ever byte-copied. The build
# directory itself is never shared between trees: Cargo's unit hashes omit the
# workspace path, so two checkouts of one workspace write the same slots and
# corrupt each other's build-script output and freshness state. The uplifted
# binaries directly under target/debug are deliberately not listed, so a tree
# only ever runs what it linked itself (SPEC §9.2a). Neither is incremental/:
# rustc keys its session directories by crate metadata, which embeds the
# workspace path, so a tree can never reuse the canonical's.
seed = ["target/debug/.fingerprint", "target/debug/build", "target/debug/deps"]
# After every build wt launches, and in `wt prune`, units the workspace will
# never read again are deleted from target/ (SPEC §11.9).
sweep = { kind = "cargo", dir = "target" }

[tools.cargo.task.sync]
run = "cargo fetch"
[tools.cargo.task.build]
run = "cargo build --all-targets"
[tools.cargo.task.test]
run = '''if [ "$#" -gt 0 ]; then cargo test "$@"; else cargo test; fi'''
[tools.cargo.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo.task.fmt]
run = "cargo fmt"

[tools.cargo-nightly-fmt]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]
sniff = [
  { file = "rustfmt.toml", toml_key = "unstable_features" },
  { file = ".rustfmt.toml", toml_key = "unstable_features" },
  { file = "rustfmt.toml", toml_key = "group_imports" },
  { file = ".rustfmt.toml", toml_key = "group_imports" },
  { file = "rustfmt.toml", toml_key = "imports_granularity" },
  { file = ".rustfmt.toml", toml_key = "imports_granularity" },
]

# Seeds and sweeps exactly as the regular cargo tool above.
seed = ["target/debug/.fingerprint", "target/debug/build", "target/debug/deps"]
sweep = { kind = "cargo", dir = "target" }

[tools.cargo-nightly-fmt.task.sync]
run = "cargo fetch"
[tools.cargo-nightly-fmt.task.build]
run = "cargo build --all-targets"
[tools.cargo-nightly-fmt.task.test]
run = '''if [ "$#" -gt 0 ]; then cargo test "$@"; else cargo test; fi'''
[tools.cargo-nightly-fmt.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo-nightly-fmt.task.fmt]
run = "cargo +nightly fmt"
