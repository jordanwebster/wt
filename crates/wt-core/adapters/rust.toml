name = "cargo"
detect = ["Cargo.toml"]
default_tool = "cargo"

[[nudge]]
want = "sccache"
used_if_env = ["RUSTC_WRAPPER=sccache"]
used_if_file = [{ file = "~/.cargo/config.toml", toml_key = "build.rustc-wrapper", contains = "sccache" }]
hint = "install sccache and set rustc-wrapper = \"sccache\" in ~/.cargo/config.toml [build]; every repo and tree on the machine then shares one compiled-crate cache, which is how a Rust tree starts warm"

[tools.cargo]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]

# One build directory per worktree, outside the tree so creation and removal
# stay cheap. The directory is never shared between trees: Cargo's unit hashes
# omit the workspace path, so two checkouts of one workspace write the same
# slots and corrupt each other's build-script output and freshness state.
# Cross-tree reuse belongs to content-addressed layers (sccache, CARGO_HOME)
# instead. CARGO_TARGET_DIR must remain unset so each tree's binary stays in
# its own target directory (SPEC §9.2a).
[tools.cargo.env]
CARGO_BUILD_BUILD_DIR = "{{home()}}/cache/cargo-build/{{label()}}/{{name_short()}}"

[tools.cargo.task.sync]
run = "cargo fetch"
[tools.cargo.task.build]
run = "cargo build --all-targets"
[tools.cargo.task.test]
run = '''if [ "$#" -gt 0 ]; then cargo test "$@"; else cargo test; fi'''
[tools.cargo.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo.task.fmt]
run = "cargo fmt"

[tools.cargo-nightly-fmt]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]
sniff = [
  { file = "rustfmt.toml", toml_key = "unstable_features" },
  { file = ".rustfmt.toml", toml_key = "unstable_features" },
  { file = "rustfmt.toml", toml_key = "group_imports" },
  { file = ".rustfmt.toml", toml_key = "group_imports" },
  { file = "rustfmt.toml", toml_key = "imports_granularity" },
  { file = ".rustfmt.toml", toml_key = "imports_granularity" },
]

# Keep output ownership identical to the regular cargo tool above.
[tools.cargo-nightly-fmt.env]
CARGO_BUILD_BUILD_DIR = "{{home()}}/cache/cargo-build/{{label()}}/{{name_short()}}"

[tools.cargo-nightly-fmt.task.sync]
run = "cargo fetch"
[tools.cargo-nightly-fmt.task.build]
run = "cargo build --all-targets"
[tools.cargo-nightly-fmt.task.test]
run = '''if [ "$#" -gt 0 ]; then cargo test "$@"; else cargo test; fi'''
[tools.cargo-nightly-fmt.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo-nightly-fmt.task.fmt]
run = "cargo +nightly fmt"
