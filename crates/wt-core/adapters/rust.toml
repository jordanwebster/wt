name = "cargo"
detect = ["Cargo.toml"]
default_tool = "cargo"

[[nudge]]
want = "sccache"
used_if_env = ["RUSTC_WRAPPER=sccache"]
hint = "install sccache and set RUSTC_WRAPPER=sccache in ~/.wt/config.toml [repos.<label>.env]; every tree then shares one compiled-crate cache, which is how a Rust tree starts warm"

[tools.cargo]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]

# Share Cargo intermediates per repository. CARGO_TARGET_DIR must remain unset
# so each tree's binary stays in its own target directory (SPEC §9.2a).
[tools.cargo.env]
CARGO_BUILD_BUILD_DIR = "${home()}/cache/cargo-build/${label()}"

[tools.cargo.task.sync]
run = "cargo fetch"
[tools.cargo.task.build]
run = "cargo build --all-targets"
[tools.cargo.task.test]
run = "cargo test"
[tools.cargo.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo.task.fmt]
run = "cargo fmt"

[tools.cargo-nightly-fmt]
requires = "cargo"
sync_inputs = ["Cargo.lock", "Cargo.toml"]
sniff = [
  { file = "rustfmt.toml", toml_key = "unstable_features" },
  { file = ".rustfmt.toml", toml_key = "unstable_features" },
  { file = "rustfmt.toml", toml_key = "group_imports" },
  { file = ".rustfmt.toml", toml_key = "group_imports" },
  { file = "rustfmt.toml", toml_key = "imports_granularity" },
  { file = ".rustfmt.toml", toml_key = "imports_granularity" },
]

# Keep output ownership identical to the regular cargo tool above.
[tools.cargo-nightly-fmt.env]
CARGO_BUILD_BUILD_DIR = "${home()}/cache/cargo-build/${label()}"

[tools.cargo-nightly-fmt.task.sync]
run = "cargo fetch"
[tools.cargo-nightly-fmt.task.build]
run = "cargo build --all-targets"
[tools.cargo-nightly-fmt.task.test]
run = "cargo test"
[tools.cargo-nightly-fmt.task.lint]
run = "cargo clippy --all-targets -- -D warnings"
[tools.cargo-nightly-fmt.task.fmt]
run = "cargo +nightly fmt"
