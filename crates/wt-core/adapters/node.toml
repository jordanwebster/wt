name = "node"
detect = ["package.json"]
default_tool = "npm"

[[nudge]]
if_tool = "npm"
want = "pnpm"
hint = "pnpm shares one content-addressed store across trees; `pnpm import` converts package-lock.json"

[tools.npm]
lockfile = ["package-lock.json", "npm-shrinkwrap.json"]
requires = "npm"
sync_inputs = ["package-lock.json", "npm-shrinkwrap.json", "package.json"]
sync = "npm ci"

[tools.pnpm]
lockfile = ["pnpm-lock.yaml"]
requires = "pnpm"
sync_inputs = ["pnpm-lock.yaml", "package.json"]
sync = "pnpm install --frozen-lockfile"

[tools.yarn]
lockfile = ["yarn.lock"]
requires = "yarn"
sync_inputs = ["yarn.lock", "package.json"]
sync = "yarn install --immutable"

[tools.bun]
lockfile = ["bun.lockb", "bun.lock"]
requires = "bun"
sync_inputs = ["bun.lockb", "bun.lock", "package.json"]
sync = "bun install --frozen-lockfile"
