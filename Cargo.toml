[package]
name = "wt"
version = "0.6.0-dev"
edition = "2024"
description = "Parameterised Git worktrees with lifecycle hooks and leases"
license = "Apache-2.0"
readme = "README.md"
keywords = ["git", "worktree", "development", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
