[workspace]
members = ["crates/wt-core", "crates/wt-sys"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[package]
name = "wt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Coordinate Git worktrees for parallel human and agent development"
license.workspace = true
readme = "README.md"
keywords = ["git", "worktree", "development", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "wt"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wt-core = { path = "crates/wt-core" }
wt-sys = { path = "crates/wt-sys" }

[features]
failpoints = ["wt-sys/failpoints"]
lock-trace = ["wt-sys/lock-trace"]

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
