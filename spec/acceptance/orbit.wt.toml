# wt coordination. Each checkout — the main one included — runs its own orbit instance:
# socket, state, identity and log under `.wt/orbit/`, found through
# ORBIT_CONFIG, with the checkout's own build first on PATH.

bin = ["target/debug"]
commands = ["orbit"]

[env]
ORBIT_CONFIG = "{{root()}}/.wt/orbit/config.yaml"
ORBIT_LOG = "{{root()}}/.wt/orbit/orbit.log"
ORBIT_INVARIANT_FATAL = "1"

[files.".wt/orbit/config.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
socket_path: {{root()}}/.wt/orbit/orbit.sock
state_path: {{root()}}/.wt/orbit/state/state.yaml
data_dir: {{root()}}/.wt/orbit/data
enable_cloud_mode: false
prevent_idle_sleep: false
claude:
  manage_plugin: false
"""

# The workspace's default-members is orbit-cli only; CI covers the whole
# workspace, so these do too.
[task.build]
run = "cargo build --workspace"

[task.test]
run = "timeout 900 cargo test --workspace --all-targets"

[task.lint]
run = "cargo clippy --workspace --all-targets --features orbit/testnet -- -D warnings"

[task.spec]
run = "timeout 900 cargo test -p orbit --features testnet --test spec"

[task.e2e]
run = "timeout 900 cargo run -p e2e-runner -- run"
needs = ["build"]

# This checkout's daemon. A resource: `wt remove` stops it.
[task.daemon]
tied_to = "tree"
name = "{{name_short()}}"
needs = ["build"]
exists = "orbit list >/dev/null 2>&1"
run = "orbit server start"
destroy = "orbit server stop"
